services:
  - type: web
    name: acme-ledger-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LEDGER_API_URL
        sync: false
      - key: AI_PIPE_TOKEN
        sync: false
      - key: AI_PIPE_BASE_URL
        value: https://aipipe.org/openrouter/v1
      - key: AI_MODEL
        value: openai/gpt-4.1-nano
